name: Test

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Test package builds
        run: npm run test:package

      - name: Validate package exports and types
        run: npm run check:package

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Benchmark smoke test
        run: npm run bench

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  compat:
    name: Node ${{ matrix.node }} runtime
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The toolchain (Vitest 5, tsdown) requires Node 22.12+, so the full
        # suite runs on Node 26 above. The published package still supports
        # Node 18+, verified here against the build produced above.
        node: [18, 20, 22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Test package on Node ${{ matrix.node }}
        run: npm run test:package
